name: Build & Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure (Release, Ninja)
        shell: pwsh
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        shell: pwsh
        run: cmake --build build

      - name: Test (doctest + node:test)
        shell: pwsh
        run: ctest --test-dir build --output-on-failure

      - name: Package zip (yipie.exe + ui/ side by side)
        shell: pwsh
        run: |
          $version = if ("${{ github.ref }}" -like "refs/tags/*") { "${{ github.ref_name }}" } else { "dev-${{ github.run_number }}" }
          New-Item -ItemType Directory -Force staging | Out-Null
          Copy-Item build/yipie.exe staging/yipie.exe -Force
          # xcopy 语义确定：目标不存在时按目录复制，不会嵌套 staging\ui\ui
          cmd /c "xcopy /e /i /y /q ui staging\ui"
          if ($LASTEXITCODE -ne 0) { Write-Error "xcopy ui -> staging failed"; exit 1 }
          if (-not (Test-Path staging\ui\index.html)) { Write-Error "staging ui incomplete"; exit 1 }
          $kb = [math]::Round((Get-Item staging/yipie.exe).Length / 1KB, 1)
          Write-Host "yipie.exe = $kb KB"
          Compress-Archive -Path staging/* -DestinationPath "YiPie-$version-win-x64.zip" -Force
          "ZIP_NAME=YiPie-$version-win-x64.zip" | Out-File -FilePath $env:GITHUB_ENV -Append

      - uses: actions/upload-artifact@v4
        with:
          name: YiPie-win-x64
          path: ${{ env.ZIP_NAME }}

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: YiPie-win-x64

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: YiPie-${{ github.ref_name }}-win-x64.zip
          generate_release_notes: true
          draft: false
          prerelease: false
